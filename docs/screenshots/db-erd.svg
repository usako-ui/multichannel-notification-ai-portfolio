<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Inter', 'Menlo', 'Consolas', monospace">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="820" height="520" fill="#F8FAFC"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A" font-family="'Inter', 'Hiragino Sans', system-ui, sans-serif">Supabase｜DB スキーマ（ERD）</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#64748B" font-family="'Inter', 'Hiragino Sans', system-ui, sans-serif">問い合わせキュー + Gemini API 予算監視の 2 テーブル構成</text>

  <g filter="url(#s)">
    <rect x="60" y="90" width="360" height="380" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="60" y="90" width="360" height="36" rx="10" fill="#0F172A"/>
    <text x="240" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">inquiry_queue</text>

    <g font-size="11" fill="#334155">
      <line x1="60" y1="140" x2="420" y2="140" stroke="#E2E8F0"/>

      <g transform="translate(80 158)">
        <text font-weight="700" fill="#B91C1C">PK</text>
        <text x="30">id</text>
        <text x="180" font-size="10" fill="#64748B">UUID DEFAULT gen_random_uuid()</text>
      </g>
      <line x1="76" y1="168" x2="404" y2="168" stroke="#F1F5F9"/>

      <g transform="translate(80 188)">
        <text font-weight="700" fill="#B45309">*</text>
        <text x="30">channel</text>
        <text x="180" font-size="10" fill="#64748B">TEXT NOT NULL</text>
      </g>
      <text x="80" y="203" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">values: 'line' | 'gmail'</text>
      <line x1="76" y1="212" x2="404" y2="212" stroke="#F1F5F9"/>

      <g transform="translate(80 232)">
        <text font-weight="700" fill="#059669">UQ</text>
        <text x="30">external_id</text>
        <text x="180" font-size="10" fill="#64748B">TEXT UNIQUE</text>
      </g>
      <text x="80" y="247" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">'line_xxx' / 'gmail_xxx' で重複防止</text>
      <line x1="76" y1="256" x2="404" y2="256" stroke="#F1F5F9"/>

      <g transform="translate(80 276)">
        <text font-weight="700" fill="#B45309">*</text>
        <text x="30">raw_content</text>
        <text x="180" font-size="10" fill="#64748B">TEXT NOT NULL</text>
      </g>
      <line x1="76" y1="290" x2="404" y2="290" stroke="#F1F5F9"/>

      <g transform="translate(80 310)">
        <text x="30">category</text>
        <text x="180" font-size="10" fill="#64748B">TEXT NULL</text>
      </g>
      <text x="80" y="325" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">賃貸 / 売買 / 内見 / クレーム / 要確認・その他</text>
      <line x1="76" y1="334" x2="404" y2="334" stroke="#F1F5F9"/>

      <g transform="translate(80 354)">
        <text x="30">is_urgent</text>
        <text x="180" font-size="10" fill="#64748B">BOOLEAN DEFAULT FALSE</text>
      </g>
      <line x1="76" y1="368" x2="404" y2="368" stroke="#F1F5F9"/>

      <g transform="translate(80 388)">
        <text x="30">status</text>
        <text x="180" font-size="10" fill="#64748B">TEXT DEFAULT 'pending'</text>
      </g>
      <text x="80" y="403" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">pending → classified → notified / failed</text>
      <line x1="76" y1="412" x2="404" y2="412" stroke="#F1F5F9"/>

      <g transform="translate(80 432)">
        <text x="30">sender_id / sender_name</text>
        <text x="220" font-size="10" fill="#64748B">TEXT NULL</text>
      </g>
      <line x1="76" y1="446" x2="404" y2="446" stroke="#F1F5F9"/>

      <g transform="translate(80 462)" font-size="10">
        <text fill="#64748B">classified_at / notified_at / created_at</text>
      </g>
    </g>
  </g>

  <g filter="url(#s)">
    <rect x="460" y="90" width="300" height="210" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="460" y="90" width="300" height="36" rx="10" fill="#065F46"/>
    <text x="610" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">gemini_usage_monthly</text>

    <g font-size="11" fill="#334155">
      <line x1="460" y1="140" x2="760" y2="140" stroke="#E2E8F0"/>

      <g transform="translate(480 158)">
        <text font-weight="700" fill="#B91C1C">PK</text>
        <text x="30">year_month</text>
        <text x="180" font-size="10" fill="#64748B">TEXT (YYYY-MM)</text>
      </g>
      <line x1="476" y1="168" x2="744" y2="168" stroke="#F1F5F9"/>

      <g transform="translate(480 188)">
        <text x="30">total_tokens</text>
        <text x="180" font-size="10" fill="#64748B">BIGINT DEFAULT 0</text>
      </g>
      <line x1="476" y1="202" x2="744" y2="202" stroke="#F1F5F9"/>

      <g transform="translate(480 222)">
        <text x="30">request_count</text>
        <text x="180" font-size="10" fill="#64748B">INTEGER DEFAULT 0</text>
      </g>
      <line x1="476" y1="236" x2="744" y2="236" stroke="#F1F5F9"/>

      <g transform="translate(480 256)">
        <text x="30">alert_sent</text>
        <text x="180" font-size="10" fill="#64748B">BOOLEAN DEFAULT FALSE</text>
      </g>
      <text x="480" y="271" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">80% 到達で LINE Push 済み</text>
      <line x1="476" y1="280" x2="744" y2="280" stroke="#F1F5F9"/>

      <g transform="translate(480 292)">
        <text font-size="10" fill="#64748B">updated_at TIMESTAMPTZ</text>
      </g>
    </g>
  </g>

  <g filter="url(#s)">
    <rect x="460" y="320" width="300" height="150" rx="10" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="610" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A" font-family="'Inter', 'Hiragino Sans', sans-serif">主要インデックス</text>

    <g transform="translate(480 358)" font-size="10" fill="#334155" font-family="'Menlo', 'Consolas', monospace">
      <text y="14">CREATE INDEX idx_inquiry_status</text>
      <text y="28">  ON inquiry_queue(status, created_at);</text>
    </g>

    <text x="610" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C" font-family="'Inter', 'Hiragino Sans', sans-serif">🔒 UNIQUE(external_id) は絶対に外さない</text>
    <text x="610" y="436" text-anchor="middle" font-size="10" fill="#64748B" font-family="'Inter', 'Hiragino Sans', sans-serif">Webhook / Pub/Sub のリトライで</text>
    <text x="610" y="450" text-anchor="middle" font-size="10" fill="#64748B" font-family="'Inter', 'Hiragino Sans', sans-serif">重複通知が飛ぶのを 23505 で吸収する</text>
  </g>

  <text x="800" y="510" text-anchor="end" font-size="9" fill="#94A3B8" font-family="'Inter', 'Hiragino Sans', sans-serif">docs/screenshots/db-erd.svg</text>
</svg>
