<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Inter', 'Hiragino Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-urgent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="url(#bg)"/>

  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">マルチチャネル通知システム｜アーキテクチャ</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748B">LINE 公式 + Gmail の問い合わせを Slack へ自動集約・クレームは 5 分以内に個人 LINE へ即時通知</text>

  <g font-size="12" fill="#334155">
    <g filter="url(#shadow)">
      <rect x="40" y="100" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="110" y="128" text-anchor="middle" font-weight="600" fill="#06C755">LINE 公式</text>
      <text x="110" y="146" text-anchor="middle" font-size="10" fill="#64748B">お客様の問い合わせ</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="180" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="110" y="208" text-anchor="middle" font-weight="600" fill="#EA4335">Gmail</text>
      <text x="110" y="226" text-anchor="middle" font-size="10" fill="#64748B">ラベル: multichannel-inbox</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="260" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="110" y="288" text-anchor="middle" font-weight="600" fill="#4285F4">GCP Pub/Sub</text>
      <text x="110" y="306" text-anchor="middle" font-size="10" fill="#64748B">Gmail Watch Push</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="240" y="140" width="200" height="240" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
      <text x="340" y="166" text-anchor="middle" font-weight="700" fill="#0F172A">Vercel Functions</text>
      <text x="340" y="184" text-anchor="middle" font-size="10" fill="#64748B">Next.js 14 App Router</text>

      <rect x="256" y="196" width="168" height="34" rx="6" fill="#F1F5F9"/>
      <text x="340" y="217" text-anchor="middle" font-size="11" fill="#0F172A">/api/webhooks/line</text>

      <rect x="256" y="234" width="168" height="34" rx="6" fill="#F1F5F9"/>
      <text x="340" y="256" text-anchor="middle" font-size="11" fill="#0F172A">/api/webhooks/gmail-push</text>

      <rect x="256" y="272" width="168" height="34" rx="6" fill="#F1F5F9"/>
      <text x="340" y="294" text-anchor="middle" font-size="11" fill="#0F172A">/api/cron/classify</text>

      <rect x="256" y="322" width="168" height="46" rx="6" fill="#FEF3F2" stroke="#FCA5A5" stroke-dasharray="3 3"/>
      <text x="340" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#B91C1C">緊急判定 → handleUrgent()</text>
      <text x="340" y="358" text-anchor="middle" font-size="10" fill="#B91C1C">SLA 5 分厳守（Cron 非経由）</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="130" width="180" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="590" y="158" text-anchor="middle" font-weight="600" fill="#3ECF8E">Supabase</text>
      <text x="590" y="176" text-anchor="middle" font-size="10" fill="#64748B">inquiry_queue（キュー）</text>
      <text x="590" y="194" text-anchor="middle" font-size="10" fill="#64748B">gemini_usage_monthly</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="230" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="590" y="258" text-anchor="middle" font-weight="600" fill="#4285F4">Gemini API</text>
      <text x="590" y="276" text-anchor="middle" font-size="10" fill="#64748B">gemini-flash-latest</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="310" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="590" y="336" text-anchor="middle" font-weight="600" fill="#334155">GitHub Actions</text>
      <text x="590" y="354" text-anchor="middle" font-size="10" fill="#64748B">schedule: */5 * * * *</text>
      <text x="590" y="370" text-anchor="middle" font-size="10" fill="#64748B">workflow_dispatch</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="740" y="110" width="180" height="180" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="830" y="136" text-anchor="middle" font-weight="600" fill="#4A154B">Slack</text>
      <text x="830" y="152" text-anchor="middle" font-size="10" fill="#64748B">5 チャネル自動振り分け</text>

      <rect x="756" y="164" width="148" height="20" rx="4" fill="#F1F5F9"/>
      <text x="830" y="179" text-anchor="middle" font-size="10" fill="#334155"># 賃貸</text>

      <rect x="756" y="188" width="148" height="20" rx="4" fill="#F1F5F9"/>
      <text x="830" y="203" text-anchor="middle" font-size="10" fill="#334155"># 売買</text>

      <rect x="756" y="212" width="148" height="20" rx="4" fill="#F1F5F9"/>
      <text x="830" y="227" text-anchor="middle" font-size="10" fill="#334155"># 内見</text>

      <rect x="756" y="236" width="148" height="20" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/>
      <text x="830" y="251" text-anchor="middle" font-size="10" font-weight="600" fill="#B91C1C">🚨 # クレーム緊急</text>

      <rect x="756" y="260" width="148" height="20" rx="4" fill="#F1F5F9"/>
      <text x="830" y="275" text-anchor="middle" font-size="10" fill="#334155"># 要確認</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="740" y="310" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="830" y="336" text-anchor="middle" font-weight="700" fill="#DC2626">営業部長 個人 LINE</text>
      <text x="830" y="354" text-anchor="middle" font-size="10" fill="#B91C1C">クレーム緊急 Push</text>
      <text x="830" y="370" text-anchor="middle" font-size="10" fill="#B91C1C">SLA 5 分以内（実測 60 秒）</text>
    </g>
  </g>

  <g stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M 180 130 L 240 168" marker-end="url(#arrow)"/>
    <path d="M 180 210 L 240 262" marker-end="url(#arrow)"/>
    <path d="M 180 290 L 240 298" marker-end="url(#arrow)"/>
    <path d="M 440 200 L 500 170" marker-end="url(#arrow)"/>
    <path d="M 440 289 L 500 289" marker-end="url(#arrow)"/>
    <path d="M 500 260 L 440 300" marker-end="url(#arrow)"/>
    <path d="M 590 310 L 590 290" marker-end="url(#arrow)"/>
    <path d="M 680 170 L 740 170" marker-end="url(#arrow)"/>
  </g>

  <g stroke="#DC2626" stroke-width="2" fill="none">
    <path d="M 440 345 Q 620 400 830 380" marker-end="url(#arrow-urgent)"/>
    <path d="M 440 345 Q 620 300 740 250" marker-end="url(#arrow-urgent)" stroke-dasharray="4 3"/>
  </g>

  <g font-size="10">
    <rect x="40" y="500" width="14" height="14" rx="3" fill="#B91C1C"/>
    <text x="60" y="512" fill="#334155">緊急パス（handleUrgent 同期実行）</text>

    <rect x="260" y="500" width="14" height="14" rx="3" fill="#64748B"/>
    <text x="280" y="512" fill="#334155">通常パス（Cron 経由・分類→投稿）</text>

    <text x="510" y="512" fill="#64748B">※ Vercel Hobby 制約で Cron は GitHub Actions へ外部化（有料プラン移行時は Vercel Cron に切り戻し可）</text>
  </g>

  <text x="920" y="548" text-anchor="end" font-size="9" fill="#94A3B8">docs/screenshots/system-architecture.svg</text>
</svg>
