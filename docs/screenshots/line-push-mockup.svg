<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Inter', 'Hiragino Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="url(#wall)"/>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">クレーム検知時の営業部長 LINE Push（実測 60 秒以内到達）</text>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#64748B">SLA 5 分厳守｜LINE Webhook / Gmail Pub/Sub Push から handleUrgent() 同期実行</text>

  <g transform="translate(80 80)">
    <rect x="0" y="0" width="240" height="380" rx="36" fill="url(#phone)" filter="url(#s)"/>
    <rect x="10" y="10" width="220" height="360" rx="28" fill="#F5F6F7"/>

    <rect x="10" y="10" width="220" height="30" rx="28" fill="#000000"/>
    <text x="30" y="30" font-size="10" font-weight="600" fill="#FFFFFF">9:36</text>
    <text x="210" y="30" text-anchor="end" font-size="10" fill="#FFFFFF">96%</text>
    <rect x="90" y="18" width="60" height="14" rx="7" fill="#000000"/>

    <text x="120" y="70" text-anchor="middle" font-size="11" fill="#94A3B8">通知</text>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#E2E8F0"/>

    <g filter="url(#s)">
      <rect x="20" y="96" width="200" height="180" rx="14" fill="#FFFFFF"/>
      <rect x="20" y="96" width="200" height="34" rx="14" fill="#06C755"/>
      <circle cx="42" cy="113" r="10" fill="#FFFFFF"/>
      <text x="42" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#06C755">L</text>
      <text x="58" y="118" font-size="11" font-weight="600" fill="#FFFFFF">LINE</text>
      <text x="212" y="118" text-anchor="end" font-size="9" fill="#FFFFFF">今</text>

      <text x="30" y="152" font-size="12" font-weight="700" fill="#0F172A">🚨 クレーム検出</text>
      <text x="30" y="172" font-size="10" fill="#334155">送信元：Gmail</text>
      <text x="30" y="187" font-size="10" fill="#334155">送信者：（お客様のお名前）さん</text>

      <text x="30" y="212" font-size="10" fill="#334155">【件名】【問い合わせ】</text>
      <text x="30" y="227" font-size="10" fill="#334155">エアコンが効かない</text>

      <text x="30" y="252" font-size="9" fill="#64748B">先月入居した部屋のエアコンが効き</text>
      <text x="30" y="264" font-size="9" fill="#64748B">ません。至急対応してください…</text>
    </g>

    <g>
      <rect x="20" y="290" width="200" height="70" rx="14" fill="#FFFFFF" opacity="0.6"/>
      <rect x="20" y="290" width="200" height="24" rx="14" fill="#4A154B" opacity="0.6"/>
      <text x="30" y="308" font-size="10" font-weight="600" fill="#FFFFFF">Slack</text>
      <text x="30" y="336" font-size="9" fill="#334155" opacity="0.7">新規メッセージ 4 件</text>
    </g>
  </g>

  <g transform="translate(360 100)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A">通知本文の見方</text>

    <g transform="translate(0 40)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#B91C1C">① 🚨 クレーム検出</text>
      <text x="14" y="38" font-size="10" fill="#64748B">緊急通知の視認性を優先する識別子</text>
    </g>

    <g transform="translate(0 100)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0F172A">② 送信元：LINE / Gmail</text>
      <text x="14" y="38" font-size="10" fill="#64748B">どの経路からの問い合わせか判別</text>
    </g>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0F172A">③ 送信者：〜さん</text>
      <text x="14" y="38" font-size="10" fill="#64748B">LINE displayName / Gmail From ヘッダから抽出</text>
    </g>

    <g transform="translate(0 220)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0F172A">④ 【件名】+ 本文</text>
      <text x="14" y="38" font-size="10" fill="#64748B">Gmail は件名結合・LINE は本文のみ</text>
    </g>

    <g transform="translate(0 290)">
      <rect x="0" y="0" width="280" height="52" rx="8" fill="#FEF3F2" stroke="#FCA5A5"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#B91C1C">⚠ 対応の目安</text>
      <text x="14" y="40" font-size="10" fill="#B91C1C">受信 5 分以内に確認・当日中に一次対応</text>
    </g>
  </g>

  <text x="700" y="470" text-anchor="end" font-size="9" fill="#94A3B8">docs/screenshots/line-push-mockup.svg</text>
</svg>
