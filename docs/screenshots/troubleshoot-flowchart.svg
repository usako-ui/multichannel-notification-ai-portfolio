<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Inter', 'Hiragino Sans', system-ui, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#F8FAFC"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">トラブルシュート判断フロー｜「問い合わせが Slack に届かない」</text>
  <text x="500" y="54" text-anchor="middle" font-size="11" fill="#64748B">manual-developer-quickref.md §3 の SVG 版・オフラインでも閲覧可能</text>

  <g filter="url(#s)">
    <ellipse cx="500" cy="98" rx="200" ry="26" fill="#0F172A"/>
    <text x="500" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">問い合わせが Slack に届かない</text>
  </g>

  <g filter="url(#s)">
    <polygon points="500,150 620,190 500,230 380,190" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="500" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">どのチャネル?</text>
  </g>

  <g filter="url(#s)">
    <polygon points="200,270 320,300 200,330 80,300" fill="#F0FDF4" stroke="#059669"/>
    <text x="200" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">LINE 401 が返る?</text>
  </g>

  <g filter="url(#s)">
    <polygon points="800,270 920,300 800,330 680,300" fill="#FEF2F2" stroke="#EA4335"/>
    <text x="800" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#B91C1C">Gmail: ラベル</text>
    <text x="800" y="314" text-anchor="middle" font-size="10" fill="#B91C1C">multichannel-inbox 付いてる?</text>
  </g>

  <g filter="url(#s)">
    <rect x="40" y="360" width="240" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="160" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Yes → LINE_CHANNEL_SECRET</text>
    <text x="160" y="402" text-anchor="middle" font-size="10" fill="#334155">不一致</text>
    <text x="160" y="420" text-anchor="middle" font-size="10" fill="#334155">Vercel env 更新 → Redeploy</text>
  </g>

  <g filter="url(#s)">
    <rect x="40" y="466" width="240" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="160" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">No 200 だが Slack 無し</text>
    <text x="160" y="508" text-anchor="middle" font-size="10" fill="#334155">Webhook URL 確認</text>
    <text x="160" y="526" text-anchor="middle" font-size="10" fill="#334155">→ LINE Developers で本番向けに</text>
  </g>

  <g filter="url(#s)">
    <rect x="360" y="360" width="280" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="500" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Slack Bot Token 有効?</text>
    <text x="500" y="402" text-anchor="middle" font-size="10" fill="#334155">No: Bot Token 期限切れ / Revoke</text>
    <text x="500" y="420" text-anchor="middle" font-size="10" fill="#334155">→ manual-developer §9 でローテーション</text>
  </g>

  <g filter="url(#s)">
    <rect x="360" y="466" width="280" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="500" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">deferred が増える?</text>
    <text x="500" y="508" text-anchor="middle" font-size="10" fill="#334155">Yes: Gemini quota 到達</text>
    <text x="500" y="526" text-anchor="middle" font-size="10" fill="#334155">→ 翌 UTC 00:00（JST 09:00）でリセット</text>
  </g>

  <g filter="url(#s)">
    <rect x="720" y="360" width="240" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="840" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">No: 振り分けルール未設定</text>
    <text x="840" y="402" text-anchor="middle" font-size="10" fill="#334155">→ manual-developer §6</text>
    <text x="840" y="420" text-anchor="middle" font-size="10" fill="#334155">ラベル multichannel-inbox 作成</text>
  </g>

  <g filter="url(#s)">
    <rect x="720" y="466" width="240" height="80" rx="10" fill="#FEF3F2" stroke="#DC2626"/>
    <text x="840" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Yes: Push 401?</text>
    <text x="840" y="502" text-anchor="middle" font-size="10" fill="#334155">→ GMAIL_PUSH_SECRET を</text>
    <text x="840" y="516" text-anchor="middle" font-size="10" fill="#334155">Vercel と GCP subscription URL の</text>
    <text x="840" y="530" text-anchor="middle" font-size="10" fill="#334155">?token= で完全一致させる</text>
  </g>

  <g stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M 500 124 L 500 150" marker-end="url(#arr)"/>
    <path d="M 380 190 L 200 270" marker-end="url(#arr)"/>
    <path d="M 620 190 L 800 270" marker-end="url(#arr)"/>

    <path d="M 200 330 L 160 360" marker-end="url(#arr)"/>
    <path d="M 200 330 L 200 466" marker-end="url(#arr)"/>

    <path d="M 800 330 L 840 360" marker-end="url(#arr)"/>
    <path d="M 800 330 L 800 466" marker-end="url(#arr)"/>

    <path d="M 320 300 L 360 400" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <path d="M 320 300 L 360 506" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  </g>

  <g font-size="10" fill="#64748B">
    <text x="440" y="164">LINE</text>
    <text x="540" y="164">Gmail</text>
    <text x="250" y="352">Yes</text>
    <text x="150" y="452">No</text>
    <text x="330" y="405">共通: Slack 側</text>
    <text x="330" y="512">共通: Gemini 側</text>
    <text x="750" y="352">No</text>
    <text x="850" y="452">Yes</text>
  </g>

  <text x="980" y="608" text-anchor="end" font-size="9" fill="#94A3B8">docs/screenshots/troubleshoot-flowchart.svg</text>
</svg>
