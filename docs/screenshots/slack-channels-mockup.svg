    <text x="220" y="221" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">2</text>

    <rect x="32" y="230" width="200" height="24" rx="4" fill="#1164A3"/>
    <text x="40" y="246" fill="#FFFFFF" font-weight="600">🚨 # クレーム緊急</text>
    <circle cx="220" cy="242" r="8" fill="#E01E5A"/>
