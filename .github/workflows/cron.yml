name: External Cron (Gmail poll + queue drain)

# =====================================================================
# 目的：Vercel Hobby プランの Cron 制約（各 Cron は 1 日 1 回まで）を回避し、
#       GitHub Actions から /api/cron/classify を定期実行するための外部 Cron。
#
# 実行内容：
#   1. Gmail 未読取り込み（pollGmailInbox・緊急時 handleUrgent 同期実行）
#   2. pending キュー消化（Gemini 分類 + Slack 投稿）
#   3. Gmail Watch 期限チェック（残り 24h 以下で users.watch 再登録）
#
# ---------------------------------------------------------------------
# トリガー戦略（2 段構え）
# ---------------------------------------------------------------------
#
# 1. workflow_dispatch（推奨・最も確実）
#    - GitHub Actions UI or `gh workflow run cron.yml` で明示発火
#    - 実機テスト・schedule 遅延時の即時消化はこちらを使う
#
# 2. schedule（ベストエフォート）
#    - `*/5 * * * *` と書いても低頻度リポジトリでは数時間 skip される既知挙動
#    - 通常の queue drain / Watch 更新には十分（下記 SLA 影響を参照）
#    - 遅延が気になるときは workflow_dispatch で補完する
#
# ---------------------------------------------------------------------
# なぜ push: main トリガーを削除したか（QA #6・2026-09-16）
# ---------------------------------------------------------------------
#
# 旧仕様では push: main を「schedule 遅延の保険」として併設していたが、
# Day8 の実機観測で以下の問題が判明：
#   - push:main は merge 完了の 5 秒後に発火
#   - Vercel 自動デプロイは 30〜90 秒かかる
#   - つまり Cron は **旧コード** を叩いてしまい、新コードの検証にならない
#
# さらに 2026-09-16 の PR #7（Gmail Pub/Sub Push）実装で、
# SLA 5 分以内が必要な Gmail クレーム経路が Cron 非依存になった。
# Cron が担うのは以下だけになり、いずれも即時性は不要：
#   - Gemini 分類 + Slack 投稿（通常問い合わせ・5 分程度の遅延許容）
#   - Gmail Watch 期限更新（7 日期限に対し 24h 手前で再登録すれば十分）
#
# 以上より push: main トリガーは無意味なコストのみが残る状態となり、
# schedule + workflow_dispatch の 2 段構えに簡素化した。
#
# ---------------------------------------------------------------------
# SLA への影響
# ---------------------------------------------------------------------
#
# - 緊急 LINE Push（クレーム SLA 5 分以内）：
#   LINE は Webhook 内で同期実行・Gmail は Pub/Sub Push で数秒到達
#   → このワークフローの遅延は SLA に一切影響しない
#
# - 通常問い合わせの Slack 投稿：
#   schedule 遅延の影響を受け得る（数時間 skip の場合あり）
#   運用者は「投稿が遅い」と感じたら Actions UI から workflow_dispatch で発火
#
# ---------------------------------------------------------------------
# 必要な GitHub Secrets
# ---------------------------------------------------------------------
#
#   - PRODUCTION_URL : 例 https://multichannel-notification-ai-dev.vercel.app
#   - CRON_SECRET    : Vercel の環境変数と同じ値
#
# =====================================================================

on:
  # 【最も確実】手動発火。実機テスト・schedule 遅延時の即時消化はこちら
  workflow_dispatch:

  # 【ベストエフォート】schedule は保証なし。通常運用の Cron 発火はこちらが主
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: cron-classify
  cancel-in-progress: false

jobs:
  ping-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/classify
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::PRODUCTION_URL または CRON_SECRET が未設定です"
            exit 1
          fi
          # -sS: サイレント + エラー表示 / -w: HTTPコード出力 / --fail-with-body: 4xx/5xx で非0終了
          # タイムアウトは Vercel Function maxDuration(60s) + マージンで 90 秒
          curl -sS \
            --fail-with-body \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP_STATUS=%{http_code}\nTOTAL_TIME=%{time_total}s\n" \
            "$PRODUCTION_URL/api/cron/classify"
