name: External Cron (Gmail poll + queue drain)

# Vercel Hobby プランは Cron を 1日1回に制限しているため、
# GitHub Actions から /api/cron/classify を定期実行する。
# 実行内容: Gmail 未読取り込み → pending キュー消化（Gemini 分類 + Slack 投稿）
#
# GitHub Actions Cron の最小間隔は 5 分。実際は数分の遅延が発生することがある。
# また、GitHub Actions の schedule 実行はリポジトリが非アクティブ時に
# 数時間〜数日遅延する場合がある（GitHub 側の既知の挙動）。
# 手動実行は Actions → External Cron → Run workflow から。
# 加えて main への push でも発火するようにして、開発中の PR マージで
# schedule 遅延を実質カバーする。
# 緊急 LINE Push（5分以内 SLA）は LINE Webhook 内で同期実行されるため、
# この Cron が遅延しても SLA には影響しない（影響するのは Gmail 通常経路のみ）。
#
# 必要な GitHub Secrets:
#   - PRODUCTION_URL : 例 https://multichannel-notification-ai-dev.vercel.app
#   - CRON_SECRET    : Vercel の環境変数と同じ値

on:
  schedule:
    - cron: "*/5 * * * *"
  # 動作確認用に手動トリガーも許可
  workflow_dispatch:
  # main への push（PR マージ含む）でも発火。schedule 遅延のカバー用
  push:
    branches:
      - main

concurrency:
  group: cron-classify
  cancel-in-progress: false

jobs:
  ping-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/classify
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::PRODUCTION_URL または CRON_SECRET が未設定です"
            exit 1
          fi
          # -sS: サイレント + エラー表示 / -w: HTTPコード出力 / --fail-with-body: 4xx/5xx で非0終了
          # タイムアウトは Vercel Function maxDuration(60s) + マージンで 90 秒
          curl -sS \
            --fail-with-body \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP_STATUS=%{http_code}\nTOTAL_TIME=%{time_total}s\n" \
            "$PRODUCTION_URL/api/cron/classify"
